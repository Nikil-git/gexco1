<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEXC Admin Login | Game Express Chennai</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%2300f0ff'/%3E%3Cstop offset='100%25' style='stop-color:%23b400ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-family='Poppins,sans-serif' font-size='55' font-weight='900' fill='%23000' text-anchor='middle'%3EGX%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --neon: #00f0ff;
            --neon2: #b400ff;
            --text: #e0e0e0;
            --text2: #a0a0b8;
            --border: #252540;
            --danger: #ff1744;
            --handwritten: 'Caveat', cursive;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
        }
        .login-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 40px 32px; width: 380px; max-width: 90%;
            box-shadow: 0 0 40px rgba(180,0,255,0.2), 0 20px 50px rgba(0,0,0,0.6);
            text-align: center; position: relative;
        }
        .login-card::before {
            content: 'admin only'; position: absolute; top: -12px; right: 20px;
            background: var(--surface); padding: 2px 15px;
            font-family: var(--handwritten); font-size: 1rem;
            color: var(--neon); border-radius: 20px; transform: rotate(2deg);
        }
        .logo { font-size: 2.8rem; font-weight: 900; background: linear-gradient(135deg, var(--neon), var(--neon2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: #ccc; }
        .form-group input { width: 100%; padding: 12px 16px; background: #1a1a28; border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.95rem; font-family: inherit; outline: none; transition: border 0.3s; }
        .form-group input:focus { border-color: var(--neon); box-shadow: 0 0 15px rgba(0,240,255,0.15); }
        .btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--neon), #00b8d4); border: none; border-radius: 30px; cursor: pointer; font-weight: 700; font-size: 1.1rem; color: #000; transition: 0.3s; box-shadow: 0 0 20px rgba(0,240,255,0.3); margin-top: 10px; font-family: var(--handwritten); font-size: 1.5rem; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(0,240,255,0.5); }
        .error-message { color: var(--danger); font-size: 0.85rem; margin-top: 12px; display: none; }
        .back-link { display: block; margin-top: 20px; color: var(--text2); font-size: 0.85rem; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">GEXC</div>
        <h2 style="margin-bottom:20px; font-weight:700;">Admin Login</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group"><label>Username</label><input type="text" id="username" required placeholder="Enter username"></div>
            <div class="form-group"><label>Password</label><input type="password" id="password" required placeholder="Enter password"></div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
        <div class="error-message" id="loginError">Invalid username or password.</div>
        <a href="index.html" class="back-link">← Back to site</a>
    </div>
    <script>
        const VALID_USERNAME = "FixwithRaj";
        const VALID_PASSWORD = "Raj@4414";

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('loginError');
            if (user === VALID_USERNAME && pass === VALID_PASSWORD) {
                sessionStorage.setItem('gexc_admin_logged_in', 'true');
                window.location.href = 'index.html?admin=1';
            } else {
                errorEl.style.display = 'block';
                document.getElementById('password').value = '';
            }
        }
    </script>
</body>
</html>
